name: Release

# Publishing a release on GitHub builds Framejet.exe and attaches it to that release, with THIRD-PARTY-NOTICES.md.
# "Run workflow" on the Actions tab does the same build and keeps the exe on the run instead.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The SDK that global.json pins. Without global.json the runner's newest SDK would build instead.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # A tag such as v1.2.0 becomes the exe's version; any other tag name leaves it at 1.0.0.
          $version = '1.0.0'
          if ($env:TAG -match '^v?(\d+(\.\d+){1,3}(-[0-9A-Za-z.-]+)?)$') { $version = $Matches[1] }
          "Version $version"
          dotnet build Framejet.sln -c Release --nologo "-p:Version=$version"

      - name: Run the Core tests
        run: dotnet test tests\Framejet.Core.Tests -c Release --no-build --nologo

      # Windows PowerShell runs on .NET Framework, like the app.
      - name: Check the exe carries all its dlls
        shell: powershell
        run: .\.github\check-single-exe.ps1 src\Framejet\bin\Release\net48

      - name: Attach Framejet.exe and THIRD-PARTY-NOTICES.md to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:TAG" src\Framejet\bin\Release\net48\Framejet.exe THIRD-PARTY-NOTICES.md --clobber --repo "$env:GITHUB_REPOSITORY"

      - name: Keep Framejet.exe on this run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Framejet
          path: src/Framejet/bin/Release/net48/Framejet.exe
          if-no-files-found: error
          retention-days: 14
