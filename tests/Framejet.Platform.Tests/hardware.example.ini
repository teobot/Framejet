# The hardware the Platform tests use on this PC. Copy this file to hardware.local.ini next to it and
# fill it in. hardware.local.ini is git-ignored, and a test whose key is blank or missing skips.
#
# The Ripsaw tests find the card by name. Its Windows container ID is in Device Manager > the card >
# Details > Container ID, or: (Get-PnpDeviceProperty -InstanceId <id> -KeyName DEVPKEY_Device_ContainerId).Data
ripsaw.container =
#
# Part of a webcam's name. The webcam tests need 1920x1080 and 1280x720 at 30 fps in MJPG, and
# 640x480 at 30 fps in YUY2, as most USB webcams have.
webcam =
webcam.container =
#
# The exact name of a microphone, used at volume 0 when the Ripsaw isn't connected.
microphone =
